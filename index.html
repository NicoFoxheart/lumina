<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina - Light in Darkness</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, #0a0e27 0%, #1a1140 50%, #0d0221 100%);
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* Vignette effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.6) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* Subtle stars background */
        #stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Snow canvas */
        #snow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Message container */
        #message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 800px;
            padding: 0 20px;
        }

        #message p {
            font-size: clamp(1.8rem, 5vw, 3.5rem);
            font-weight: 200;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0);
            text-shadow: 
                0 0 20px rgba(200, 220, 255, 0),
                0 0 40px rgba(200, 220, 255, 0);
            transition: all 2s cubic-bezier(0.4, 0, 0.2, 1);
            line-height: 1.6;
        }

        #message p.show {
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 
                0 0 30px rgba(200, 220, 255, 0.8),
                0 0 60px rgba(200, 220, 255, 0.4),
                0 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* Instruction at bottom */
        #instruction {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0);
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            font-weight: 300;
            z-index: 10;
            transition: color 2s ease;
        }

        #instruction.show {
            color: rgba(255, 255, 255, 0.4);
        }

        /* Mobile adjustments */
        @media (max-width: 768px) {
            #message p {
                letter-spacing: 0.08em;
            }
        }
    </style>
</head>
<body>
    <!-- Stars background -->
    <canvas id="stars"></canvas>
    
    <!-- Snow canvas -->
    <canvas id="snow"></canvas>
    
    <!-- Message -->
    <div id="message">
        <p></p>
    </div>
    
    <!-- End instruction -->
    <div id="instruction">Tap to refresh and experience again</div>

    <script>
        // =====================================
        // STARS BACKGROUND
        // =====================================
        
        const starsCanvas = document.getElementById('stars');
        const starsCtx = starsCanvas.getContext('2d');
        
        function resizeStars() {
            starsCanvas.width = window.innerWidth;
            starsCanvas.height = window.innerHeight;
            drawStars();
        }
        
        function drawStars() {
            starsCtx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
            
            // Draw small twinkling stars
            for (let i = 0; i < 100; i++) {
                const x = Math.random() * starsCanvas.width;
                const y = Math.random() * starsCanvas.height;
                const size = Math.random() * 1.5;
                const opacity = Math.random() * 0.3 + 0.1;
                
                starsCtx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                starsCtx.beginPath();
                starsCtx.arc(x, y, size, 0, Math.PI * 2);
                starsCtx.fill();
            }
        }
        
        resizeStars();
        window.addEventListener('resize', resizeStars);
        
        // Subtle star twinkling
        setInterval(() => {
            drawStars();
        }, 3000);
        
        // =====================================
        // SNOW SYSTEM
        // =====================================
        
        const snowCanvas = document.getElementById('snow');
        const snowCtx = snowCanvas.getContext('2d');
        
        function resizeSnow() {
            snowCanvas.width = window.innerWidth;
            snowCanvas.height = window.innerHeight;
        }
        resizeSnow();
        window.addEventListener('resize', resizeSnow);
        
        class Snowflake {
            constructor() {
                this.reset();
                this.y = Math.random() * snowCanvas.height;
                this.opacity = Math.random() * 0.6 + 0.3;
            }
            
            reset() {
                this.x = Math.random() * snowCanvas.width;
                this.y = -10;
                this.size = Math.random() * 3 + 1;
                this.speed = Math.random() * 0.5 + 0.3;
                this.drift = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.6 + 0.3;
                this.blur = Math.random() > 0.5;
            }
            
            update() {
                this.y += this.speed;
                this.x += this.drift;
                
                if (this.y > snowCanvas.height) {
                    this.reset();
                }
                
                if (this.x > snowCanvas.width + 10) {
                    this.x = -10;
                } else if (this.x < -10) {
                    this.x = snowCanvas.width + 10;
                }
            }
            
            draw() {
                snowCtx.save();
                
                if (this.blur) {
                    snowCtx.filter = 'blur(1px)';
                }
                
                const gradient = snowCtx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.size * 2
                );
                gradient.addColorStop(0, `rgba(255, 255, 255, ${this.opacity})`);
                gradient.addColorStop(0.5, `rgba(220, 230, 255, ${this.opacity * 0.6})`);
                gradient.addColorStop(1, `rgba(200, 220, 255, 0)`);
                
                snowCtx.fillStyle = gradient;
                snowCtx.beginPath();
                snowCtx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
                snowCtx.fill();
                
                snowCtx.restore();
            }
        }
        
        // Create snowflakes
        const snowflakes = [];
        const snowCount = window.innerWidth < 768 ? 60 : 80;
        
        for (let i = 0; i < snowCount; i++) {
            snowflakes.push(new Snowflake());
        }
        
        function animateSnow() {
            snowCtx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);
            
            snowflakes.forEach(flake => {
                flake.update();
                flake.draw();
            });
            
            requestAnimationFrame(animateSnow);
        }
        
        animateSnow();
        
        // =====================================
        // MESSAGES SYSTEM
        // =====================================
        
        const messages = [
            { text: "Hey... you there?", duration: 4000 },
            { text: "Yeah, you", duration: 3500 },
            { text: "I see you", duration: 4000 },
            { text: "I know you're hurting", duration: 4500 },
            { text: "I know it's heavy", duration: 4000 },
            { text: "But you're still here", duration: 4500 },
            { text: "Still breathing", duration: 4000 },
            { text: "Still moving", duration: 4000 },
            { text: "You don't have to be okay", duration: 5000 },
            { text: "You just have to be here", duration: 5000 },
            { text: "And you are", duration: 4000 },
            { text: "You're still here", duration: 4500 },
            { text: "That's everything", duration: 5000 },
            { text: "Every tear you've cried?", duration: 4500 },
            { text: "Every crack in your heart?", duration: 5000 },
            { text: "They're not weakness", duration: 4500 },
            { text: "They're proof you're real", duration: 5000 },
            { text: "Proof you're feeling", duration: 4500 },
            { text: "You don't have to be fixed to be whole", duration: 6000 },
            { text: "Look around you", duration: 4000 },
            { text: "This gentle snow", duration: 4500 },
            { text: "Soft and beautiful", duration: 4500 },
            { text: "Falling quietly", duration: 4000 },
            { text: "Like your struggles", duration: 4500 },
            { text: "Coming down gently", duration: 4500 },
            { text: "But always passing", duration: 4500 },
            { text: "Always moving", duration: 4000 },
            { text: "Nothing stays forever", duration: 5000 },
            { text: "Not the pain", duration: 4000 },
            { text: "Not the snow", duration: 4000 },
            { text: "But you remain", duration: 4500 },
            { text: "Strong", duration: 3500 },
            { text: "Beautiful", duration: 3500 },
            { text: "Whole", duration: 4000 },
            { text: "Don't give up", duration: 5000 },
            { text: "Please", duration: 4000 },
            { text: "The world needs you", duration: 5000 },
            { text: "Your light", duration: 4000 },
            { text: "Your heart", duration: 4000 },
            { text: "YOU", duration: 5000 },
            { text: "You are Lumina", duration: 5500 },
            { text: "Light in the darkness", duration: 5500 },
            { text: "Even when you can't see it", duration: 5500 },
            { text: "Especially then", duration: 5000 },
            { text: "This snow will melt", duration: 5000 },
            { text: "The pain will ease", duration: 5000 },
            { text: "But you?", duration: 4000 },
            { text: "You're forever", duration: 4500 },
            { text: "You're important", duration: 4500 },
            { text: "You matter", duration: 5000 },
            { text: "And you always were", duration: 8000 }
        ];
        
        const messageEl = document.querySelector('#message p');
        const instructionEl = document.getElementById('instruction');
        let currentMessage = 0;
        
        function showMessage(index) {
            if (index >= messages.length) {
                // End of messages - show instruction
                setTimeout(() => {
                    instructionEl.classList.add('show');
                }, 2000);
                return;
            }
            
            const msg = messages[index];
            
            // Fade in
            messageEl.textContent = msg.text;
            setTimeout(() => {
                messageEl.classList.add('show');
            }, 100);
            
            // Fade out and next
            setTimeout(() => {
                messageEl.classList.remove('show');
                setTimeout(() => {
                    showMessage(index + 1);
                }, 2000); // Gap between messages
            }, msg.duration);
        }
        
        // Start after brief delay
        setTimeout(() => {
            showMessage(0);
        }, 1500);
        
        // Tap to refresh
        let tapped = false;
        document.addEventListener('click', () => {
            if (instructionEl.classList.contains('show') && !tapped) {
                tapped = true;
                location.reload();
            }
        });
    </script>
</body>
</html>
